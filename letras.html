    <style>
        :root {

            text-transform: uppercase;

            color: #94a3b8;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .modern-selector {
            max-width: 1100px;
            margin: 0 auto 60px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 0 24px;
        }

        .track-pill {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: #94a3b8;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .track-pill:hover,
        .track-pill.active {
            background: white;
            color: #020617;
            border-color: white;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        .artifact-display {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .glass-artifact {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(40px);
            border-radius: 24px;
            padding: 80px 60px;
            min-height: 600px;
            position: relative;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }

        .artifact-content {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease;
        }

        .artifact-content.active {
            opacity: 1;
            transform: translateY(0);
        }

        .modern-title {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            margin-bottom: 50px;
            line-height: 1;
            letter-spacing: -1px;
        }

        .modern-lyrics {
            font-size: 1.3rem;
            line-height: 1.8;
            font-weight: 300;
            color: #cbd5e1;
            white-space: pre-line;
            max-width: 650px;
            margin: 0 auto;
            text-align: left;
        }

        .unused-lyric {
            opacity: 0.25;
            font-style: italic;
            display: block;
            margin: 10px 0;
        }

        .modern-track-num {
            display: inline-block;
            background: var(--accent-glow);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.7rem;

        .album-tabs {

            gap: 16px;

        .album-tab {
            background: transparent;

            padding: 16px 32px;

            font-weight: 700;

            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);

        .album-tab:hover {

            color: white;
        }

        .album-tab.active {
            background: var(--accent-glow);
            border-color: var(--accent-glow);

    <script>
        // Album data organized by language
        const albumData = {
            es: [
                { track: "01", title: "Mi Señal", lyrics: "[Intro]\nEl silencio me acompaña, y pesa en mi interior,\nlos días se repiten, y todo pierde color.\n\n[Verso 1]\nLas horas se arrastran, la casa es un espejo,\nmi mente da vueltas, buscando algún reflejo.\nSueños que quise, proyectos que dejé,\nla motivación se esconde y no sé dónde la dejé.\n\n[Coro]\nEstoy aquí, encerrado con mis pensamientos,\ntratando de no perderme entre los momentos.\nSigo buscando, aunque la fuerza se escape,\ncada día resisto, aunque a veces todo me tape.\n\n[Puente]\nY si mañana todo sigue igual,\nseguiré aquí, buscando mi señal.\nNo hay milagros, no hay final feliz,\nsolo la música que me hace resistir." },
                { track: "02", title: "Entre Sombras", lyrics: "[Intro]\nEn la penumbra de mis recuerdos me pierdo,\ncada esquina del pasado sigue siendo mi acuerdo.\n\n[Verso 1]\nCamino por pasillos de memorias gastadas,\nvoces que resuenan, promesas olvidadas.\n\n[Coro]\nEntre sombras me encuentro buscando claridad,\natrapado en los ecos de lo que fue verdad.\n\n[Puente]\nLas sombras me susurran lo que ya no soy,\npero en la oscuridad también encuentro quién soy hoy." },
                { track: "03", title: "Frío Cercano", lyrics: "[Intro]\nEl frío se instala entre nosotros, sin palabras,\ncada mirada tuya es una puerta que se cierra.\n\n[Coro]\nVivo en este espacio vacío que compartimos,\nbuscando alguna señal en tus gestos sin vida.\n\n[Puente]\nAprendo a aceptar que no todo se puede salvar,\ny en el silencio encuentro mi propia paz." },
                { track: "04", title: "Ecos del Silencio", lyrics: "[Intro]\nEl vacío se instala, parece que nada importa,\ncada intento de conexión se quiebra y se aborta.\n\n[Coro]\nEcos del silencio llenan este lugar,\nbuscando una chispa que nos haga despertar.\n\n[Puente]\nLos ecos del silencio me enseñan a escuchar,\nlo que antes era ruido hoy es paz que puedo amar." },
                { track: "05", title: "Última Mirada", lyrics: "[Intro]\nCierro los ojos y suelto tu reflejo,\nel peso en mi pecho ya no merece mi aliento.\n\n[Coro]\nDejo de amarte, lo que nunca fue mío,\nlibero tu sombra y abrazo mi propio brío.\n\n[Puente]\nLa última mirada es el cierre de un capítulo,\nmi alma se renueva, libre de lo que fue un obstáculo." },
                { track: "06", title: "Luz que Queda", lyrics: "[Intro]\nEl viento me lleva, dejo atrás las sombras,\ncada suspiro mío se vuelve un hilo de luz que me nombra.\n\n[Coro]\nRespiro en la calma que quedó después del adiós,\nmi corazón se reconstruye, aprende a su propio son.\n\n[Puente]\nEl pasado se desvanece como polvo en el viento,\nrenazco sin miedo, y me reconozco en mi centro." },
                { track: "07", title: "Sombras que Dejo", lyrics: "[Intro]\nMe alejo de los ecos que ya no me pertenecen,\ncada paso que doy deja atrás lo que entristece.\n\n[Coro]\nSon sombras que dejo, ya no pesan en mí,\ncada lágrima vieja se convierte en un fin.\n\n[Puente]\nNo miro atrás, el pasado es solo lección,\nsombras que dejo, y mi alma se elevará." },
                { track: "08", title: "Latido Propio", lyrics: "[Intro]\nEscucho mi corazón, marcando un ritmo nuevo,\ncada latido me recuerda que todavía me muevo.\n\n[Coro]\nSigo el latido propio, no necesito tu voz,\nmi fuerza nace de adentro, renace mi sol.\n\n[Puente]\nNo hay cadenas, no hay fantasmas que me frenen,\nlatido propio que me enseña a ser mi propio guía." },
                { track: "09", title: "Horizonte Vacío", lyrics: "[Intro]\nMiro adelante y solo hay un cielo gris,\nel horizonte se pierde entre lo que fui.\n\n[Coro]\nCamino hacia un horizonte vacío,\ncon miedo y esperanza entrelazados en el río.\n\n[Puente]\nNo hay certezas, solo pasos y reflexión,\naprendo a caminar entre dudas y poesía." },
                { track: "10", title: "Aire Nuevo", lyrics: "[Intro]\nRespiro profundo y siento el cambio en mí,\nel viento me guía hacia un camino por descubrir.\n\n[Coro]\nAire nuevo recorre mi piel y mi ser,\ncada instante me invita a volver a creer.\n\n[Puente]\nNo miro atrás, solo al horizonte brillante,\naire nuevo que me guía hacia la paz que hallaré." }
            ],
            en: [
                { track: "01", title: "My Sign", lyrics: "[Intro]\nSilence walks beside me, heavy in my core,\nthe days keep repeating, and everything fades to gray.\n\n[Verse 1]\nThe hours drag on, the house is like a mirror,\nmy mind keeps spinning, searching for a glimmer of hope.\nDreams I once wanted, projects I left behind,\nmotivation hides, I don’t know where it went.\n\n[Chorus]\nI’m here, locked inside my thoughts,\ntrying not to lose myself in fleeting moments.\nI keep on searching, even as my strength slips away,\nevery day I hold on, though at times it all drowns me.\n\n[Verse 2]\nThe light creeps in slowly, sketching out my doubts,\ntime stretches long, and I hear only whispers.\nI try to rise, but I fall once again,\nthe plans I once had don't feel like they'll return.\n\n[Chorus]\nI’m here, locked inside my thoughts,\ntrying not to lose myself in fleeting moments.\nI keep on searching, even as my strength slips away,\nevery day I hold on, though at times it all drowns me.\n\n[Bridge]\nAnd if tomorrow feels the same as today,\nI’ll still be here, searching for my sign.\nNo miracles, no happy ending,\nonly music keeps me alive, keeps me strong." },
                { track: "02", title: "In the Shadows", lyrics: "[Intro]\nThe city sleeps, but I'm still wide awake,\nwith thoughts that feel heavy, a weight I can't shake.\n\n[Verse 1]\nThe clock keeps moving, but I stay in this place,\nideas that burn me, memories I can't erase.\nI walk through the shadows of what could've been,\ntrying not to get lost, trying to believe again.\n\n[Chorus]\nI stand my ground, even when everything feels gray,\nsearching for moments that make me feel alive each day.\nEvery sigh, every gesture, every try,\nkeeps me standing, even when the wind tries to make me fly.\n\n[Verse 2]\nSmall victories that no one can ever see,\nwords I tell myself just to hold on and be me.\nThe routine traps me, the pressure pushes hard,\nbut I keep pushing forward, though it wants to pull me apart.\n\n[Chorus]\nI stand my ground, even when everything feels gray,\nsearching for moments that make me feel alive each day.\nEvery sigh, every gesture, every try,\nkeeps me standing, even when the wind tries to make me fly.\n\n[Bridge]\nTime drags me along, and I don't know where I'm bound,\nthe days weigh heavy, and I feel like I'm losing ground." },
                { track: "03", title: "Close Yet Cold", lyrics: "[Section 1]\nI sleep beside you, but I feel an empty space,\nyour body's warmth can't seem to warm this lonely place.\n\n[Section 2]\nEach night I spend hours counting the silence,\nwatching your gestures that betray a cold distance.\nWords that float away, lost in the air,\nand I'm searching for a hug that's just not there.\n\n[Section 3]\nBetween you and I, and the distance that divides,\nI get lost in the night while your gaze just flies by.\nI try to get closer, though your skin feels like a wall,\nand every attempt ends with me standing alone after all.\n\n[Section 4]\nThe routine holds us, closeness feels like pain,\nshared laughter sounds so foreign, like a distant rain.\nI look at your face, but I find no clues,\njust shadows that hide all your truthful views.\n\n[Section 5]\nBetween you and I, and the distance that divides,\nI get lost in the night while your gaze just flies by.\nI try to get closer, though your skin feels like a wall,\nand every attempt ends with me standing alone after all.\n\n[Section 6]\nI stay awake, listening to echoes of your silence,\nwondering if you'll ever feel my earnest attempts.\nNo promises, no movie endings to see,\njust the night embracing me as I search for what's left of you and me." },
                { track: "04", title: "Echoes of Silence", lyrics: "[Intro]\nThe house breathes, but I'm still absent from this space,\nsounds pass right by, never touching my face.\n\n[Verse 1]\nYour steps pass by like echoes I can't touch,\nand I get lost in walls that suffocate me so much.\nI see your silence like a distant mirror's glass,\nand my own spirit fades away, trying to make it last.\n\n[Chorus]\nI live in this empty space that we share together,\nsearching for a sign in your lifeless gestures forever.\nEvery try dissolves, every word just slips away,\nand I keep drifting in a reality that traps me day by day.\n\n[Verse 2]\nThe clock keeps ticking, but I'm stuck right where I am,\ntrying to find some warmth where coldness has a plan.\nImaginary hugs fill up my empty room,\nbut the truth hits hard, breaking through the gloom.\n\n[Chorus]\nI live in this empty space that we share together,\nsearching for a sign in your lifeless gestures forever.\nEvery try dissolves, every word just slips away,\nand I keep drifting in a reality that traps me day by day.\n\n[Bridge]\nI don't expect miracles or borrowed promises from you,\nI'm just searching for a thread to pull us through.\nMeanwhile, I learn to hold on in the shade,\na ghost in the void that calls my name every night I've made." },
                { track: "05", title: "Last Glance", lyrics: "[Intro]\nI close my eyes and let go of your reflection,\nthe weight on my chest no longer deserves my affection.\n\n[Verse 1]\nYour empty words dissolve into the air,\nmy memories of you start to disappear.\nEvery attempt to hold on now fails to sustain,\nand nostalgia becomes a strength that helps me to break the chain.\n\n[Chorus]\nI fall out of love with what was never mine,\nI free your shadow and embrace my own design.\nI no longer search for signs where there’s only distance,\nI close this chapter with quiet elegance.\n\n[Verse 2]\nI walk lighter now, my heart feels more free,\ninvisible chains break and vanish quietly.\nI'm learning to breathe without waiting for your warmth,\ndiscovering self-love is my true driving force.\n\n[Chorus]\nI fall out of love with what was never mine,\nI free your shadow and embrace my own design.\nI no longer search for signs where there’s only distance,\nI close this chapter with quiet elegance.\n\n[Bridge]\nThere's no resentment, just clarity in my steps,\nI no longer get lost in your silences or empty threats.\nGoodbye finds me strong and at peace,\nmy heart reborn as your soul finds its release." },
                { track: "06", title: "Remaining Light", lyrics: "[Intro]\nThe wind carries me, and I leave the shadows behind,\nevery sigh turns into a thread of light that I find.\n\n[Verse 1]\nI walk through memories that no longer bind,\nthe days teach me that everything unwinds.\nThe silence is with me, but now it’s a friend,\nevery step I take brings me closer to where I begin.\n\n[Chorus]\nI breathe in the calm that was left after the goodbye,\nmy heart rebuilds itself, learning its own way to fly.\nNo more chains or ghosts to follow me,\njust the light that remains, and my wings to set me free.\n\n[Verse 2]\nThe nights don’t weigh on me, I see my reflection,\nmy voice resonates strong, I've got my own direction.\nI'm learning to love myself without your shadow near,\nevery beat of my heart becomes my own strongest gear.\n\n[Chorus]\nI breathe in the calm that was left after the goodbye,\nmy heart rebuilds itself, learning its own way to fly.\nNo more chains or ghosts to follow me,\njust the light that remains, and my wings to set me free.\n\n[Bridge]\nThe past fades away like dust on the wind,\nevery tear brings me closer to the strength I have within.\nToday I celebrate the echo of who I've become,\nreborn without fear, my journey has just begun." },
                { track: "07", title: "Shadows I Leave Behind", lyrics: "[Intro]\nI'm stepping away from echoes that don't belong to me,\nevery step I take leaves behind what used to grieve me.\n\n[Verse 1]\nMemories float like smoke in the air,\nthey wrap me for a moment, then just disappear.\nI try to hold on to what no longer wants to stay,\nbut my empty hands are learning to let go each day.\n\n[Chorus]\nThese are the shadows I'm leaving, they don't weigh me down,\nevery old tear turns into an ending I've found.\nI walk light, even though goodbyes can sting,\nand silence teaches me how to live again.\n\n[Verse 2]\nThe moments I cherished now feel far away,\nwhispers that once hurt now have nothing to say.\nNostalgia brushes past me, but it doesn't hold me down,\nevery step sets me free, every farewell wears a crown.\n\n[Chorus]\nThese are the shadows I'm leaving, they don't weigh me down,\nevery old tear turns into an ending I've found.\nI walk light, even though goodbyes can sting,\nand silence teaches me how to live again.\n\n[Bridge]\nI don't look back, the past is just a lesson for me,\nmy heart learns from every distant memory.\nI release what was, and embrace what's to come,\nthe shadows I leave behind, and my soul will rise as one." },
                { track: "08", title: "My Own Beat", lyrics: "[Intro]\nI hear my heart, setting a brand-new pace,\nevery beat reminds me I’m still in this place.\n\n[Verse 1]\nShadows of the past try to pull me down,\nbut I feel a pulse inside that lifts me off the ground.\nMy own steps are guiding me along the way,\nand every breath brings me closer to my destiny today.\n\n[Chorus]\nI follow my own beat, I don’t need your voice,\nmy strength comes from within, my sun has a choice.\nThough memories hurt, though fear still shakes the core,\nmy heart beats strong and fills me with so much more.\n\n[Verse 2]\nI'm learning to love myself without looking outside,\nevery move I make lights up my own tide.\nMistakes I made no longer define me,\nmy heartbeat leads me, and my fears fade from me.\n\n[Chorus]\nI follow my own beat, I don’t need your voice,\nmy strength comes from within, my sun has a choice.\nThough memories hurt, though fear still shakes the core,\nmy heart beats strong and fills me with so much more.\n\n[Bridge]\nNo chains, no ghosts to hold me back,\nmy spirit awakens, my doubts fall off track.\nToday I celebrate the pulse running through my veins,\nmy own beat teaches me to be my own guide again." },

        let currentAlbum = 'es';
        const selector = document.getElementById('modern-selector');
        const render = document.getElementById('artifact-render');
        const albumTabs = document.querySelectorAll('.album-tab');

        function renderSongs(album) {
            selector.innerHTML = '';
            const songs = albumData[album];
            const fragmentLabel = album === 'es' ? 'Fragmento' : 'Fragment';

            songs.forEach((song, idx) => {
                const pill = document.createElement('button');
                pill.className = 'track-pill';
                pill.textContent = song.title;

                const selectSong = () => {
                    document.querySelectorAll('.track-pill').forEach(b => b.classList.remove('active'));
                    pill.classList.add('active');
                    render.classList.remove('active');

                    setTimeout(() => {
                        render.innerHTML = `
                            <span class="modern-track-num">${fragmentLabel} ${song.track}</span>
                            <h2 class="modern-title">${song.title}</h2>
                            <div class="modern-lyrics">${song.lyrics}</div>
                        `;
                        render.classList.add('active');

                        if (typeof gtag === 'function') {
                            gtag('event', 'view_lyrics', {
                                'song_title': song.title,
                                'song_track': song.track,
                                'album': album
                            });
                        }
                    }, 300);
                };

                pill.addEventListener('click', selectSong);
                selector.appendChild(pill);
                if (idx === 0) selectSong();
            });
        }

        albumTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                albumTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentAlbum = tab.dataset.album;
                renderSongs(currentAlbum);
            });
        });

        // Initial render
        renderSongs(currentAlbum);
    </script>
